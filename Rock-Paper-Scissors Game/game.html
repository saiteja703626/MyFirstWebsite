<!DOCTYPE html>
<html>

<head>
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="styles/game.css">
</head>

<body>
  <header>
    <a href="/" class="lounge-banner" aria-label="Return to Lounge homepage">
      <span class="banner-track">
        <span>
          ← Click on this banner to go to Lounge page ·
          Thanks for playing the game! ·
        </span>
        <span aria-hidden="true">
          ← Click on this banner to go to Lounge page ·
          Thanks for playing the game! ·
        </span>
      </span>
    </a>
  </header>

  <main class="game-container">

    <h1 class="heading">Rock Paper Scissors</h1>

    <p>
      <button class="emoji-button">
        <img src="images/Rock-emoji.png" class="emoji-icon js-rock-button">
      </button>

      <button class="emoji-button">
        <img src="images/Paper-emoji.png" class="emoji-icon js-paper-button">
      </button>

      <button class="emoji-button">
        <img src="images/Scissors-emoji.png" class="emoji-icon js-scissors-button">
      </button>
    </p>

  <div class="result-container">
    <p class="js-result result"></p>
    <p class="js-moves moves"></p>
  </div>



  <p class="js-score"></p>

  <p>
    <button class="reset-score"
      onclick="score.wins=0;score.loses=0;score.draws=0;localStorage.removeItem('score'); updateScoreElement();">Reset
      Score</button>
    <!-- <button class="auto-play-button" onclick="
      autoPlay();
      document.querySelector('.auto-play-button').innerHTML='Stop Play'
      ">Auto Play</button> -->
    <button class="auto-play-button" onclick="autoPlay();">
      Auto Play
    </button>
  </p>

  <script src="scripts/game.js">
  </script>
</body>

</html>
